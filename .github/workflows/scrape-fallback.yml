name: Scrape fallback (runner)

# FALLBACK ONLY: use if ALDI blocks AWS IP addresses (the scheduled Lambda then fails with
# "blocked" and emails an alarm). Runs the same scraper CLI on a GitHub-hosted runner and
# writes to DynamoDB with the same safety rules (soft-removes products missing from 2 consecutive
# successful runs, D-123; aborts with no writes below 50% of the last successful run; skips
# the removal step on partial runs; fails loudly rather than remove more than 25%).
#
# Writing needs the opt-in role from docs/SETUP.md "Scrape fallback" (D-037): it may only
# query the catalogue index and write PRODUCT#/SCRAPE# items. A dry run needs no AWS
# access.

on:
  # Switch-over (docs/SETUP.md): set repository variable SCRAPE_FALLBACK_ENABLED=true and
  # this runs every Friday at 5pm Canberra time on its own. Cron is UTC-only and Canberra
  # observes daylight saving, so both times are scheduled and the first step lets only the
  # one that is 17:00 in Australia/Sydney through: 06:00 UTC = 17:00 AEDT (Oct-Apr),
  # 07:00 UTC = 17:00 AEST (Apr-Oct). GitHub may delay scheduled runs (often by minutes,
  # sometimes much longer at busy times); a run delayed past 18:00 is skipped by the guard.
  schedule:
    - cron: '0 6 * * 5'
    - cron: '0 7 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch and report only, no AWS access)'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: catalogue-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape ALDI from the runner
    # Scheduled runs only when switched over; manual runs always.
    if: github.event_name == 'workflow_dispatch' || vars.SCRAPE_FALLBACK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALDI_SERVICE_POINT: ${{ vars.ALDI_SERVICE_POINT }}
      # Scheduled runs (no inputs) write; manual runs default to a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      # First real step: exit early unless it is 17:xx in Canberra (see the schedule above).
      - name: Only scrape at 5pm Canberra time
        id: guard
        run: .github/scripts/schedule-guard.sh "$GITHUB_EVENT_NAME"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Dry run
        if: steps.guard.outputs.run == 'true' && env.DRY_RUN == 'true'
        run: npm run scrape -w @trolley/scraper -- --dry-run --trigger github-fallback --out "$RUNNER_TEMP/products.json"

      - name: Check fallback configuration
        if: steps.guard.outputs.run == 'true' && env.DRY_RUN != 'true'
        env:
          ROLE: ${{ vars.AWS_SCRAPE_ROLE_ARN }}
          TABLE: ${{ vars.TROLLEY_TABLE_NAME }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run on main (the AWS role only trusts main)."; exit 1
          fi
          if [ -z "$ROLE" ] || [ -z "$TABLE" ]; then
            echo "::error::Set AWS_SCRAPE_ROLE_ARN and TROLLEY_TABLE_NAME (docs/SETUP.md, Scrape fallback)."; exit 1
          fi

      - name: Configure AWS credentials (OIDC, catalogue-only role)
        if: steps.guard.outputs.run == 'true' && env.DRY_RUN != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SCRAPE_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-session-name: trolley-scrape-fallback-${{ github.run_id }}

      - name: Scrape and write
        if: steps.guard.outputs.run == 'true' && env.DRY_RUN != 'true'
        env:
          TABLE_NAME: ${{ vars.TROLLEY_TABLE_NAME }}
        run: npm run scrape -w @trolley/scraper -- --trigger github-fallback
